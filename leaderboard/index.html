<!DOCTYPE html>
<html>
<head>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="../MM31Bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="leaderboard.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>

    <title>Leaderboard - MechMania</title>
    <link rel="icon" href="/images/mm32logo.svg" />
</head>

<body>
    <!-- Navbar -->
    <div id="navBar"></div>
    <script>
        $(function () {
            $("#navBar").load("/navBar.html", function() {
                const script = document.createElement('script');
                script.src = '/auth/auth.js';
                script.onload = function() {
                    if (window.authManager) {
                        setTimeout(() => {
                            window.authManager.updateUIForLoggedInUser();
                        }, 100);
                    }
                };
                document.head.appendChild(script);
            });
        });
    </script>

    <!-- Banner -->
    <div
      id="logo_banner"
      class="container-fluid d-flex align-items-center justify-content-center"
      style="background: linear-gradient(135deg, #2e3b35 0%, #242e29 100%); min-height: 250px; position: relative; overflow: hidden;"
    >
        <div class="text-center text-white position-relative" style="z-index: 2;">
            <div class="mb-1">
                <i class="fas fa-trophy" style="font-size: 3rem; text-shadow: 2px 2px 6px rgba(0,0,0,0.6);"></i>
            </div>
            <h1 class="display-3 fw-bold mb-3" style="text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7); color: #fcfaf4;">
                Leaderboard
            </h1>
            <p class="lead mb-0" style="font-size: 1.2rem; text-shadow: 2px 2px 6px rgba(0,0,0,0.5); color: #ffffff;">
            View leaderboard to track team performance across friendly tournaments!
            </p>
        </div>

        <div class="position-absolute" style="top: 20%; left: 15%; opacity: 0.1; z-index: 1;">
            <i class="fas fa-medal" style="font-size: 6rem; transform: rotate(-15deg);"></i>
        </div>
        <div class="position-absolute" style="bottom: 20%; right: 15%; opacity: 0.1; z-index: 1;">
            <i class="fas fa-users" style="font-size: 5rem; transform: rotate(15deg);"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-5">
        <div id="leaderboardContainer">
            <div class="table-responsive">
                <table id="leaderboard" class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center">Rank</th>
                            <th class="text-center">Team</th>
                            <th class="text-center">Score</th>
                            <th class="text-center">Matches</th>
                            <th class="text-center">Wins</th>
                            <th class="text-center">Losses</th>
                            <th class="text-center">Ties</th>
                        </tr>
                    </thead>
                    <tbody>
                    
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
        $(function () {
            $("#footer").load("/footer.html");
        });
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"
    ></script>
    <script src="leaderboard.js"></script>
</body>
</html>
